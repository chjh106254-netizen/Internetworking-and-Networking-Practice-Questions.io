<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>網路概論刷題站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. Home lists chapters as rows with mode chips; quiz is one card at a time with a sticky action bar. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#10151f; --muted:#586174; --line:#d9dfe9;
  --accent:#1c4fd8; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --good:#127a4a; --good-soft:#def3e8; --bad:#bf252c; --bad-soft:#fde7e8; --warn:#8a5a00; --warn-soft:#fff2d6;
  --font-ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1118; --surface:#151b25; --ink:#e7ecf4; --muted:#93a0b6; --line:#273143;
    --accent:#7ba3ff; --accent-ink:#0b1220; --accent-soft:#1b2a4f;
    --good:#4cc58b; --good-soft:#12301f; --bad:#ff7d84; --bad-soft:#3b161a; --warn:#f0c060; --warn-soft:#37290c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#151b25; --ink:#e7ecf4; --muted:#93a0b6; --line:#273143;
  --accent:#7ba3ff; --accent-ink:#0b1220; --accent-soft:#1b2a4f;
  --good:#4cc58b; --good-soft:#12301f; --bad:#ff7d84; --bad-soft:#3b161a; --warn:#f0c060; --warn-soft:#37290c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
code{font-family:var(--font-mono);font-size:.9em;background:var(--accent-soft);color:var(--ink);padding:.05em .4em;border-radius:4px;word-break:break-all}
.num{font-variant-numeric:tabular-nums}

/* ---------- Home ---------- */
.prompt{font-family:var(--font-mono);font-size:13px;color:var(--muted);letter-spacing:.02em}
.prompt b{color:var(--accent)}
.title{font-size:clamp(28px,6vw,38px);line-height:1.15;font-weight:900;letter-spacing:-.01em;text-wrap:balance;margin-top:6px}
.lede{color:var(--muted);margin-top:8px;max-width:60ch}
.summary{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.summary b{color:var(--ink);font-weight:700}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.qbtn:hover:not(:disabled){border-color:var(--accent)}
.qbtn:disabled{opacity:.5;cursor:not-allowed}
.qbtn .t{font-weight:700}
.qbtn .s{font-size:13px;color:var(--muted)}
.qbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbtn.primary .s{color:inherit;opacity:.85}
.settings{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;font-size:14px}
.settings label{display:flex;align-items:center;gap:8px}
.settings select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.settings input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.units{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.unit{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.unit + .unit{border-top:1px solid var(--line)}
.unit .nm{font-weight:700}
.unit .sb{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:baseline}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip .m{font-size:12px;color:var(--muted)}
.chip .m.full{color:var(--good);font-weight:700}
.foot{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}

/* ---------- Quiz ---------- */
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:14px}
.back:hover{border-color:var(--accent)}
.ttl{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-weight:700;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.tag.multi{background:var(--warn-soft);color:var(--warn)}
.q{font-size:18px;font-weight:500;line-height:1.55;overflow-wrap:anywhere}
.q .en{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.q .big{font-weight:900;font-size:26px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--muted)}
.opt .tx{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt .tx .en{display:block;font-size:13px;color:var(--muted)}
.opt .st{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding-top:4px;white-space:nowrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.right .st{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.wrong .st{color:var(--bad)}
.fb{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-weight:700}
.fb .ans{color:var(--ink)}
.fb .note{color:var(--ink);font-size:14px;border-top:1px dashed currentColor;padding-top:6px;margin-top:4px}
.actions{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.btn{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}

/* ---------- Result ---------- */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score .of{font-size:20px;color:var(--muted)}
.score .pct{margin-left:auto;font-family:var(--font-mono);font-size:22px;font-weight:700}
.pct.good{color:var(--good)} .pct.mid{color:var(--warn)} .pct.low{color:var(--bad)}
.grp{display:flex;flex-direction:column;gap:10px;min-width:0}
.wlist{display:flex;flex-direction:column;gap:10px}
details.w{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.w summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.w summary::-webkit-details-marker{display:none}
details.w summary .qs{flex:1;min-width:0;overflow-wrap:anywhere}
details.w summary .tg{flex:none;font-size:12px;color:var(--muted)}
details.w[open] summary{border-bottom:1px solid var(--line)}
details.w .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion: reduce){.bar > i{transition:none}}
@media (max-width:420px){.card{padding:14px}.q{font-size:17px}.score .big{font-size:46px}}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA={"units":[{"id":"net1","name":"網路基礎","sub":"裝置、媒體與網路類型"},{"id":"net2","name":"網路架構與安全","sub":"容錯、QoS、安全與雲端"},{"id":"ios","name":"Cisco IOS","sub":"模式、命令與存取方式"},{"id":"proto","name":"網路通訊與協定","sub":"協定、封裝、單播與標準組織"},{"id":"osi","name":"OSI 與 TCP/IP 模型","sub":"分層、PDU、ARP 與預設閘道"},{"id":"phy1","name":"實體層（一）","sub":"媒體、編碼、調變與頻寬"},{"id":"phy2","name":"實體層（二）與資料鏈結層","sub":"纜線、光纖、無線標準與訊框"}],"questions":[{"id":"ios.s1","unit":"ios","kind":"single","n":1,"q":["Cisco 網路裝置使用的網路作業系統稱為什麼？（What is the network operating system used by Cisco network devices called?）"],"opts":[["A",["Windows"]],["B",["Linux"]],["C",["Cisco IOS"]],["D",["Android"]]],"ans":"C"},{"id":"ios.s2","unit":"ios","kind":"single","n":2,"q":["作業系統中直接與硬體互動的部分稱為什麼？（What is the part of an operating system that directly interacts with hardware called?）"],"opts":[["A",["Shell"]],["B",["Kernel"]],["C",["CLI"]],["D",["GUI"]]],"ans":"B"},{"id":"ios.s3","unit":"ios","kind":"single","n":3,"q":["Cisco IOS 最常使用哪種方式存取？（Which method is most commonly used to access Cisco IOS devices?）"],"opts":[["A",["GUI"]],["B",["CLI"]],["C",["Email"]],["D",["Web Camera"]]],"ans":"B"},{"id":"ios.s4","unit":"ios","kind":"single","n":4,"q":["IOS 映像通常儲存在何處？（Where is the IOS image typically stored?）"],"opts":[["A",["RAM"]],["B",["Flash"]],["C",["CPU Cache"]],["D",["Keyboard"]]],"ans":"B"},{"id":"ios.s5","unit":"ios","kind":"single","n":5,"q":["哪一種記憶體屬於揮發性記憶體？（Which type of memory is volatile?）"],"opts":[["A",["Flash"]],["B",["ROM"]],["C",["RAM"]],["D",["NVRAM"]]],"ans":"C"},{"id":"ios.s6","unit":"ios","kind":"single","n":6,"q":["下列哪一種方式屬於帶外管理？（Which method provides out-of-band management?）"],"opts":[["A",["Console"]],["B",["HTTP"]],["C",["FTP"]],["D",["DNS"]]],"ans":"A"},{"id":"ios.s7","unit":"ios","kind":"single","n":7,"q":["哪一種遠端存取方式會對管理會談資料進行加密？（Which remote access method encrypts management session data?）"],"opts":[["A",["Telnet"]],["B",["SSH"]],["C",["AUX"]],["D",["Console"]]],"ans":"B"},{"id":"ios.s8","unit":"ios","kind":"single","n":8,"q":["User EXEC Mode 的提示字元通常為何？（What is the typical prompt for User EXEC Mode?）"],"opts":[["A",["`Switch#`"]],["B",["`Switch(config)#`"]],["C",["`Switch>`"]],["D",["`Switch(config-if)#`"]]],"ans":"C"},{"id":"ios.s9","unit":"ios","kind":"single","n":9,"q":["Privileged EXEC Mode 的提示字元通常為何？（What is the typical prompt for Privileged EXEC Mode?）"],"opts":[["A",["`Switch>`"]],["B",["`Switch#`"]],["C",["`Switch(config)#`"]],["D",["`Switch(config-line)#`"]]],"ans":"B"},{"id":"ios.s10","unit":"ios","kind":"single","n":10,"q":["哪一個命令可從 User EXEC Mode 進入 Privileged EXEC Mode？（Which command enters Privileged EXEC Mode from User EXEC Mode?）"],"opts":[["A",["`disable`"]],["B",["`enable`"]],["C",["`exit`"]],["D",["`configure`"]]],"ans":"B"},{"id":"ios.s11","unit":"ios","kind":"single","n":11,"q":["哪一個命令可以從 Privileged EXEC Mode 進入 Global Configuration Mode？（Which command enters Global Configuration Mode from Privileged EXEC Mode?）"],"opts":[["A",["`enable`"]],["B",["`configure terminal`"]],["C",["`show running-config`"]],["D",["`hostname`"]]],"ans":"B"},{"id":"ios.s12","unit":"ios","kind":"single","n":12,"q":["Interface Configuration Mode 主要用來做什麼？（What is Interface Configuration Mode mainly used for?）"],"opts":[["A",["設定網路介面"]],["B",["設定使用者密碼"]],["C",["顯示 IOS 版本"]],["D",["顯示啟動設定"]]],"ans":"A"},{"id":"ios.s13","unit":"ios","kind":"single","n":13,"q":["哪一個命令可顯示所有介面的統計資訊？（Which command displays statistics for all interfaces?）"],"opts":[["A",["`show version`"]],["B",["`show interfaces`"]],["C",["`show hostname`"]],["D",["`show password`"]]],"ans":"B"},{"id":"ios.s14","unit":"ios","kind":"single","n":14,"q":["哪一個命令可以顯示目前執行中的設定？（Which command displays the current running configuration?）"],"opts":[["A",["`show startup-config`"]],["B",["`show running-config`"]],["C",["`show version`"]],["D",["`show interfaces`"]]],"ans":"B"},{"id":"ios.s15","unit":"ios","kind":"single","n":15,"q":["哪一個命令顯示儲存在 NVRAM 中的設定？（Which command displays the configuration stored in NVRAM?）"],"opts":[["A",["`show startup-config`"]],["B",["`show running-config`"]],["C",["`show interfaces`"]],["D",["`show version`"]]],"ans":"A"},{"id":"ios.s16","unit":"ios","kind":"single","n":16,"q":["哪一個命令可以顯示 IOS 版本及硬體相關資訊？（Which command displays IOS version and hardware-related information?）"],"opts":[["A",["`show interfaces`"]],["B",["`show version`"]],["C",["`show startup-config`"]],["D",["`hostname`"]]],"ans":"B"},{"id":"ios.s17","unit":"ios","kind":"single","n":17,"q":["在 IOS 中輸入 `?` 的主要用途是什麼？（What is the main purpose of entering `?` in Cisco IOS?）"],"opts":[["A",["重新啟動裝置"]],["B",["顯示 Context-Sensitive Help"]],["C",["儲存設定"]],["D",["關閉介面"]]],"ans":"B"},{"id":"ios.s18","unit":"ios","kind":"single","n":18,"q":["哪一個快捷鍵可以返回 Privileged EXEC Mode？（Which shortcut returns to Privileged EXEC Mode?）"],"opts":[["A",["Ctrl-A"]],["B",["Ctrl-E"]],["C",["Ctrl-Z"]],["D",["Ctrl-R"]]],"ans":"C"},{"id":"ios.s19","unit":"ios","kind":"single","n":19,"q":["哪一個命令可設定交換器的 Hostname？（Which command configures the hostname of a switch?）"],"opts":[["A",["`name Switch1`"]],["B",["`hostname Switch1`"]],["C",["`host Switch1`"]],["D",["`setname Switch1`"]]],"ans":"B"},{"id":"ios.s20","unit":"ios","kind":"single","n":20,"q":["哪一個命令較適合用來保護 Privileged EXEC Mode？（Which command is recommended for protecting Privileged EXEC Mode?）"],"opts":[["A",["`enable password`"]],["B",["`enable secret`"]],["C",["`hostname`"]],["D",["`line console 0`"]]],"ans":"B"},{"id":"ios.s21","unit":"ios","kind":"single","n":21,"q":["下列哪一個是 Cisco IOS 的主要操作介面？（Which is the primary operating interface for Cisco IOS?）"],"opts":[["A",["GUI"]],["B",["CLI"]],["C",["BIOS"]],["D",["Desktop"]]],"ans":"B"},{"id":"ios.s22","unit":"ios","kind":"single","n":22,"q":["當使用者看到 `Switch>` 時，目前位於哪一種模式？（When the prompt is `Switch>`, which mode is the device in?）"],"opts":[["A",["User EXEC Mode"]],["B",["Privileged EXEC Mode"]],["C",["Global Configuration Mode"]],["D",["Interface Configuration Mode"]]],"ans":"A"},{"id":"ios.s23","unit":"ios","kind":"single","n":23,"q":["當使用者看到 `Switch#` 時，目前位於哪一種模式？（When the prompt is `Switch#`, which mode is the device in?）"],"opts":[["A",["User EXEC Mode"]],["B",["Privileged EXEC Mode"]],["C",["Global Configuration Mode"]],["D",["Line Configuration Mode"]]],"ans":"B"},{"id":"ios.s24","unit":"ios","kind":"single","n":24,"q":["下列哪個命令可以進入 Global Configuration Mode？（Which command enters Global Configuration Mode?）"],"opts":[["A",["`enable`"]],["B",["`configure terminal`"]],["C",["`disable`"]],["D",["`exit`"]]],"ans":"B"},{"id":"ios.s25","unit":"ios","kind":"single","n":25,"q":["哪一個命令可以返回 User EXEC Mode？（Which command returns to User EXEC Mode?）"],"opts":[["A",["`enable`"]],["B",["`disable`"]],["C",["`configure terminal`"]],["D",["`hostname`"]]],"ans":"B"},{"id":"ios.s26","unit":"ios","kind":"single","n":26,"q":["哪一個命令可以顯示目前執行的設定？（Which command displays the current running configuration?）"],"opts":[["A",["`show version`"]],["B",["`show interfaces`"]],["C",["`show running-config`"]],["D",["`show startup-config`"]]],"ans":"C"},{"id":"ios.s27","unit":"ios","kind":"single","n":27,"q":["哪一種遠端管理方式比 Telnet 提供更安全的傳輸？（Which remote management method provides more secure transmission than Telnet?）"],"opts":[["A",["SSH"]],["B",["AUX"]],["C",["Console"]],["D",["HTTP"]]],"ans":"A"},{"id":"ios.s28","unit":"ios","kind":"single","n":28,"q":["下列哪個命令可以設定裝置名稱？（Which command configures the device name?）"],"opts":[["A",["`device-name`"]],["B",["`hostname`"]],["C",["`router-name`"]],["D",["`switch-name`"]]],"ans":"B"},{"id":"ios.s29","unit":"ios","kind":"single","n":29,"q":["下列哪個命令可顯示 IOS 版本資訊？（Which command displays IOS version information?）"],"opts":[["A",["`show interfaces`"]],["B",["`show version`"]],["C",["`show startup-config`"]],["D",["`show running-config`"]]],"ans":"B"},{"id":"ios.s30","unit":"ios","kind":"single","n":30,"q":["哪一個命令可保護 Privileged EXEC Mode 並使用加密密碼？（Which command protects Privileged EXEC Mode using an encrypted password?）"],"opts":[["A",["`enable password`"]],["B",["`enable secret`"]],["C",["`password secret`"]],["D",["`secret enable`"]]],"ans":"B"},{"id":"ios.m1","unit":"ios","kind":"multi","n":1,"q":["下列哪些是 Cisco IOS 的主要功能？（Which of the following are major functions of Cisco IOS?）"],"opts":[["A",["Network Security"]],["B",["IP Addressing"]],["C",["Routing"]],["D",["QoS"]],["E",["Network Management"]]],"ans":"ABCDE"},{"id":"ios.m2","unit":"ios","kind":"multi","n":2,"q":["下列哪些方式可以存取 Cisco IOS CLI？（Which methods can be used to access the Cisco IOS CLI?）"],"opts":[["A",["Console"]],["B",["Telnet"]],["C",["SSH"]],["D",["AUX"]],["E",["Bluetooth Speaker"]]],"ans":"ABCD"},{"id":"ios.m3","unit":"ios","kind":"multi","n":3,"q":["下列哪些屬於 Cisco IOS 的主要操作模式？（Which are major Cisco IOS operating modes?）"],"opts":[["A",["User EXEC Mode"]],["B",["Privileged EXEC Mode"]],["C",["Global Configuration Mode"]],["D",["Interface Configuration Mode"]],["E",["Line Configuration Mode"]]],"ans":"ABCDE"},{"id":"ios.m4","unit":"ios","kind":"multi","n":4,"q":["下列哪些屬於 IOS 常見的 `show` 命令？（Which are common IOS `show` commands?）"],"opts":[["A",["`show interfaces`"]],["B",["`show startup-config`"]],["C",["`show running-config`"]],["D",["`show version`"]],["E",["`show password`"]]],"ans":"ABCD"},{"id":"ios.m5","unit":"ios","kind":"multi","n":5,"q":["下列哪些是 IOS 常見的命令錯誤類型？（Which are common types of IOS command errors?）"],"opts":[["A",["Ambiguous Command"]],["B",["Incomplete Command"]],["C",["Incorrect Command"]],["D",["Network Cable Error"]],["E",["Monitor Error"]]],"ans":"ABC"},{"id":"ios.m6","unit":"ios","kind":"multi","n":6,"q":["下列哪些是良好密碼設定的原則？（Which are good password configuration practices?）"],"opts":[["A",["密碼長度大於 8 個字元"]],["B",["混合大小寫、數字及特殊字元"]],["C",["所有裝置使用相同密碼"]],["D",["避免使用容易猜測的常用字"]],["E",["不同權限可以使用不同密碼"]]],"ans":"ABDE"},{"id":"ios.m7","unit":"ios","kind":"multi","n":7,"q":["下列哪些敘述正確描述 Console、Telnet 與 SSH？（Which statements correctly describe Console, Telnet, and SSH?）"],"opts":[["A",["Console 可以在網路服務尚未設定時存取裝置"]],["B",["Telnet 可建立遠端 CLI 會談"]],["C",["SSH 可建立遠端 CLI 會談"]],["D",["SSH 會加密管理會談資料"]],["E",["Telnet 比 SSH 更安全"]]],"ans":"ABCD"},{"id":"net1.s1","unit":"net1","kind":"single","n":1,"q":["下列何者最適合描述 Internet？","Which of the following best describes the Internet?"],"opts":[["A",["一個由單一公司管理的區域網路","A local area network managed by a single company"]],["B",["一個只提供電子郵件服務的網路","A network that provides only email services"]],["C",["全球互連的網路集合","A collection of globally interconnected networks"]],["D",["一個只由無線裝置組成的網路","A network consisting only of wireless devices"]]],"ans":"C"},{"id":"net1.s2","unit":"net1","kind":"single","n":2,"q":["在網路中，所有直接參與網路通訊的電腦稱為什麼？","What are all computers that directly participate in network communication called?"],"opts":[["A",["中介裝置（Intermediary Device）","Intermediary Device"]],["B",["主機（Host）","Host"]],["C",["媒體（Medium）","Medium"]],["D",["路由器（Router）","Router"]]],"ans":"B"},{"id":"net1.s3","unit":"net1","kind":"single","n":3,"q":["下列何者屬於中介網路裝置？","Which of the following is an intermediary network device?"],"opts":[["A",["筆記型電腦","Laptop"]],["B",["印表機","Printer"]],["C",["路由器","Router"]],["D",["Web Browser"]]],"ans":"C"},{"id":"net1.s4","unit":"net1","kind":"single","n":4,"q":["下列哪一項不是網路基礎建設的三大類網路元件？","Which of the following is NOT one of the three major categories of network components in a network infrastructure?"],"opts":[["A",["裝置（Device）","Device"]],["B",["媒體（Medium）","Medium"]],["C",["網路服務（Network Services）","Network Services"]],["D",["作業系統（Operating System）","Operating System"]]],"ans":"D"},{"id":"net1.s5","unit":"net1","kind":"single","n":5,"q":["LAN 的主要特徵為何？","What is the main characteristic of a LAN?"],"opts":[["A",["覆蓋全球","It covers the entire globe."]],["B",["覆蓋較小的地理區域","It covers a relatively small geographic area."]],["C",["一定由 ISP 管理","It is always managed by an ISP."]],["D",["只能使用無線傳輸","It can only use wireless transmission."]]],"ans":"B"},{"id":"net1.s6","unit":"net1","kind":"single","n":6,"q":["下列何者最符合 WAN 的特性？","Which of the following best describes the characteristics of a WAN?"],"opts":[["A",["只連接同一間教室的電腦","It only connects computers in the same classroom."]],["B",["覆蓋廣闊地理區域並互連不同 LAN","It covers a large geographic area and interconnects different LANs."]],["C",["只能使用 Wi-Fi","It can only use Wi-Fi."]],["D",["只能由個人管理","It can only be managed by an individual."]]],"ans":"B"},{"id":"net1.s7","unit":"net1","kind":"single","n":7,"q":["哪一種拓樸圖主要描述裝置、連接埠及 IP 定址方案？","Which type of topology diagram primarily describes devices, ports, and IP addressing schemes?"],"opts":[["A",["實體拓樸圖","Physical Topology Diagram"]],["B",["邏輯拓樸圖","Logical Topology Diagram"]],["C",["電力拓樸圖","Power Topology Diagram"]],["D",["無線拓樸圖","Wireless Topology Diagram"]]],"ans":"B"},{"id":"net1.s8","unit":"net1","kind":"single","n":8,"q":["下列哪一種網路媒體使用光脈衝傳輸資料？","Which type of network media uses light pulses to transmit data?"],"opts":[["A",["金屬導線","Metal wires"]],["B",["光纖","Fiber-optic cable"]],["C",["同軸纜線","Coaxial cable"]],["D",["無線電波","Radio waves"]]],"ans":"B"},{"id":"net1.s9","unit":"net1","kind":"single","n":9,"q":["下列何者是用戶端軟體的例子？","Which of the following is an example of client software?"],"opts":[["A",["Chrome Browser"]],["B",["Router"]],["C",["Switch"]],["D",["Firewall"]]],"ans":"A"},{"id":"net1.s10","unit":"net1","kind":"single","n":10,"q":["何謂統合網路（Converged Network）？","What is a converged network?"],"opts":[["A",["只提供語音服務的網路","A network that provides only voice services"]],["B",["只提供 Web 服務的網路","A network that provides only Web services"]],["C",["使用同一通訊通道傳輸語音、視訊、文字及圖片等資訊","A network that uses the same communication channel to transmit information such as voice, video, text, and images"]],["D",["只能使用光纖的網路","A network that can only use fiber-optic cables"]]],"ans":"C"},{"id":"net2.s1","unit":"net2","kind":"single","n":1,"q":["下列何者不是網路底層架構必須解決的四個基本特性之一？","(Which is NOT one of the four basic characteristics?)"],"opts":[["A",["容錯能力 (Fault tolerance)"]],["B",["可延伸性 (Scalability)"]],["C",["成本最小化 (Cost minimization)"]],["D",["安全性 (Security)"]]],"ans":"C"},{"id":"net2.s2","unit":"net2","kind":"single","n":2,"q":["下列何者描述電路交換網路的特徵？","(Which describes a circuit-switched network?)"],"opts":[["A",["訊息切成封包各自選路 (Messages split into packets routed independently)"]],["B",["通話期間電路專供該通話使用，即使無人說話也保持活動 (Circuit is dedicated to the call and stays active even when no one speaks)"]],["C",["尖峰期只會延遲不會被拒絕 (Peak times only cause delay, never rejection)"]],["D",["不需建立端對端連線 (No end-to-end connection is needed)"]]],"ans":"B"},{"id":"net2.s3","unit":"net2","kind":"single","n":3,"q":["下列何者不是分封交換封包中的定址資訊欄位？","(Which is NOT an addressing field carried in a packet?)"],"opts":[["A",["來源位址 (Source address)"]],["B",["目的位址 (Destination address)"]],["C",["序號 (Sequence number)"]],["D",["應用程式密碼 (Application password)"]]],"ans":"D"},{"id":"net2.s4","unit":"net2","kind":"single","n":4,"q":["在 Internet 中心、提供國家與國際連線且彼此視為對等的是：","(Which ISPs sit at the center of the Internet, provide national/international connectivity, and treat each other as peers?)"],"opts":[["A",["第 1 級 ISP (Tier 1)"]],["B",["第 2 級 ISP (Tier 2)"]],["C",["第 3 級 ISP (Tier 3)"]],["D",["本地 ISP (Local ISP)"]]],"ans":"A"},{"id":"net2.s5","unit":"net2","kind":"single","n":5,"q":["網路頻寬以下列何者衡量？","(Bandwidth is measured in:)"],"opts":[["A",["封包/分鐘 (packets per minute)"]],["B",["位元/秒 (bits per second)"]],["C",["位元組/小時 (bytes per hour)"]],["D",["訊框/日 (frames per day)"]]],"ans":"B"},{"id":"net2.s6","unit":"net2","kind":"single","n":6,"q":["當記憶體佇列已滿且封包持續湧入，裝置會：","(When the memory queue is full and packets keep arriving, the device will:)"],"opts":[["A",["增加頻寬 (Increase bandwidth)"]],["B",["改用電路交換 (Switch to circuit switching)"]],["C",["丟棄封包 (Drop packets)"]],["D",["通知來源停機 (Shut down the source)"]]],"ans":"C"},{"id":"net2.s7","unit":"net2","kind":"single","n":7,"q":["在 QoS 政策中，通常可接受較低優先權的通訊是：","(Which traffic can usually accept a lower priority in a QoS policy?)"],"opts":[["A",["IP 語音 (VoIP)"]],["B",["視訊會議 (Video conferencing)"]],["C",["網頁瀏覽 (Web browsing)"]],["D",["金融交易 (Financial transactions)"]]],"ans":"C"},{"id":"net2.s8","unit":"net2","kind":"single","n":8,"q":["「在漏洞出現的第一天發起的攻擊」稱為：","(An attack launched on the first day a vulnerability appears is called:)"],"opts":[["A",["服務阻斷攻擊 (DoS)"]],["B",["零時差攻擊 (Zero-day attack)"]],["C",["身份竊取 (Identity theft)"]],["D",["間諜軟體 (Spyware)"]]],"ans":"B"},{"id":"net2.s9","unit":"net2","kind":"single","n":9,"q":["下列何者是維持資料機密性的方法？","(Which method maintains data confidentiality?)"],"opts":[["A",["資料加密 (Data encryption)"]],["B",["增加佇列大小 (Larger queues)"]],["C",["增加備援路徑 (More redundant paths)"]],["D",["優先權分類 (Priority classification)"]]],"ans":"A"},{"id":"net2.s10","unit":"net2","kind":"single","n":10,"q":["雲端運算實際上是指：","(Cloud computing essentially refers to:)"],"opts":[["A",["以 Web 為基礎的計算 (Web-based computing)"]],["B",["只在本地電腦執行的計算 (Computing only on local computers)"]],["C",["以電力線傳輸資料 (Data over power lines)"]],["D",["電路交換電話服務 (Circuit-switched telephony)"]]],"ans":"A"},{"id":"net2.m1","unit":"net2","kind":"multi","n":1,"q":["下列哪些屬於容錯網路的特徵？","(Which are characteristics of a fault-tolerant network?)"],"opts":[["A",["來源與目的之間有多條路徑 (Multiple paths between source and destination)"]],["B",["一條路徑失敗可立即改走其他鏈路 (Traffic can immediately use another link when one fails)"]],["C",["能在故障時快速回復 (Recovers quickly from failures)"]],["D",["以優先權佇列決定封包順序 (Priority queues decide packet order)"]],["E",["以加密保護封包內容 (Encryption protects packet content)"]]],"ans":"ABC"},{"id":"net2.m2","unit":"net2","kind":"multi","n":2,"q":["下列哪些是分封交換網路的特性？","(Which are characteristics of packet-switched networks?)"],"opts":[["A",["不需預留端對端電路 (No end-to-end circuit reserved)"]],["B",["同一訊息的封包可走不同路徑 (Packets of one message may take different paths)"]],["C",["封包在目的地依序號重組 (Packets are reassembled by sequence number at the destination)"]],["D",["網路內裝置通常只看來源與目的位址 (Devices typically see only source and destination addresses)"]],["E",["尖峰期新呼叫會被拒絕 (New calls are rejected at peak times)"]]],"ans":"ABCD"},{"id":"net2.m3","unit":"net2","kind":"multi","n":3,"q":["下列哪些通訊通常應提高優先權？","(Which traffic should typically be given higher priority?)"],"opts":[["A",["IP 語音 (VoIP)"]],["B",["視訊會議 (Video conferencing)"]],["C",["生產控制/業務交易資料 (Production control / business transaction data)"]],["D",["點對點檔案分享 (P2P file sharing)"]],["E",["一般電子郵件 (Ordinary e-mail)"]]],"ans":"ABC"},{"id":"net2.m4","unit":"net2","kind":"multi","n":4,"q":["下列哪些屬於外部安全威脅？","(Which are external security threats?)"],"opts":[["A",["病毒、蠕蟲與特洛伊木馬 (Viruses, worms, Trojans)"]],["B",["間諜軟體與廣告軟體 (Spyware and adware)"]],["C",["服務阻斷攻擊 (DoS)"]],["D",["資料攔截與竊取 (Data interception and theft)"]],["E",["員工遺失裝置 (Employee losing a device)"]]],"ans":"ABCD"},{"id":"net2.m5","unit":"net2","kind":"multi","n":5,"q":["下列哪些是大型/企業網路額外常見的安全要求？","(Which are additional security requirements common in large/enterprise networks?)"],"opts":[["A",["專用防火牆系統 (Dedicated firewall systems)"]],["B",["存取控制清單 (ACL)"]],["C",["入侵防禦系統 (IPS)"]],["D",["虛擬私有網路 (VPN)"]],["E",["家用路由器基本過濾 (Basic filtering on a home router)"]]],"ans":"ABCD"},{"id":"net2.m6","unit":"net2","kind":"multi","n":6,"q":["下列哪些是資料中心的組成？","(Which are components of a data center?)"],"opts":[["A",["備援資料通訊連線 (Redundant data communications connections)"]],["B",["高速虛擬伺服器 (High-speed virtual servers)"]],["C",["備援儲存系統/SAN (Redundant storage / SAN)"]],["D",["備用電源與環境控制 (Backup power and environmental control)"]],["E",["使用者個人筆電 (Users' personal laptops)"]]],"ans":"ABCD"},{"id":"net2.m7","unit":"net2","kind":"multi","n":7,"q":["下列哪些屬於自攜裝置 (BYOD) 的範例？","(Which are examples of BYOD devices?)"],"opts":[["A",["筆記型電腦 (Laptop)"]],["B",["平板電腦 (Tablet)"]],["C",["智慧型手機 (Smartphone)"]],["D",["電子閱讀器 (E-reader)"]],["E",["HomePlug 電力線介面卡 (HomePlug powerline adapter)"]]],"ans":"ABCD"},{"id":"net2.m8","unit":"net2","kind":"multi","n":8,"q":["下列哪些是線上協作的優勢？","(Which are advantages of online collaboration?)"],"opts":[["A",["提高客戶滿意度 (Improved customer satisfaction)"]],["B",["支援行動使用者 (Support for mobile users)"]],["C",["改善組織溝通 (Improved organizational communication)"]],["D",["降低差旅成本 (Lower travel costs for training/events)"]],["E",["增加實體工作空間需求 (More physical workspace needed)"]]],"ans":"ABCD"},{"id":"net2.m9","unit":"net2","kind":"multi","n":9,"q":["下列哪些是雲端運算的優勢？","(Which are advantages of cloud computing?)"],"opts":[["A",["組織靈活性 (Organizational flexibility)"]],["B",["降低基礎建設成本 (Reduced infrastructure cost)"]],["C",["重新調整 IT 資源 (Re-focus of IT resources)"]],["D",["建立新業務模式 (New business models)"]],["E",["本地電腦須承擔所有負載 (Local PC must bear all workload)"]]],"ans":"ABCD"},{"id":"net2.m10","unit":"net2","kind":"multi","n":10,"q":["依教材，下列哪些是 CCNA 課程涵蓋的技術或協定？","(According to the material, which technologies/protocols does the CCNA course cover?)"],"opts":[["A",["OSPF"]],["B",["Frame Relay"]],["C",["VLAN"]],["D",["ACL"]],["E",["HomePlug 電力線標準 (HomePlug powerline standard)"]]],"ans":"ACD"},{"id":"proto.s1","unit":"proto","kind":"single","n":1,"q":["下列何者是網路通訊的基本元素？（Which of the following is a basic element of network communication?）"],"opts":[["A",["CPU"]],["B",["訊息來源（Source）"]],["C",["作業系統"]],["D",["硬碟"]]],"ans":"B"},{"id":"proto.s2","unit":"proto","kind":"single","n":2,"q":["下列何者最適合描述 Network Protocol？（Which best describes a network protocol?）"],"opts":[["A",["網路硬體設備"]],["B",["規範通訊的規則集合"]],["C",["一種網路纜線"]],["D",["一種 CPU"]]],"ans":"B"},{"id":"proto.s3","unit":"proto","kind":"single","n":3,"q":["將資訊轉換成適合傳輸形式的程序稱為什麼？（What is the process of converting information into a suitable form for transmission called?）"],"opts":[["A",["Decoding"]],["B",["Routing"]],["C",["Encoding"]],["D",["Forwarding"]]],"ans":"C"},{"id":"proto.s4","unit":"proto","kind":"single","n":4,"q":["將封裝後的訊息還原以進行處理的程序稱為什麼？（What is the process of removing encapsulation to process the message called?）"],"opts":[["A",["Encoding"]],["B",["Decoding"]],["C",["Routing"]],["D",["Segmenting"]]],"ans":"B","note":"原檔答案為 B。嚴格來說「還原封裝」稱為 De-encapsulation，選項中沒有此詞，Decoding 最接近。"},{"id":"proto.s5","unit":"proto","kind":"single","n":5,"q":["下列哪一項描述 Encapsulation 最正確？（Which best describes encapsulation?）"],"opts":[["A",["將訊息分割成多個片段"]],["B",["將一種訊息格式放入另一種格式"]],["C",["將訊息加密"]],[" n":4,"q":["下列哪些協定屬於 TCP/IP Internet Protocol Suite？（Which protocols are part of the TCP/IP Internet protocol suite?）"],"opts":[["A",["IP"]],["B",["HTTP"]],["C",["DHCP"]],["D",["TCP"]],["E",["FTP"]]],"ans":"ABCDE","note":"原檔標示 A、B、C、D，依內容 E 也正確，已校正。"},{"id":"proto.m5","unit":"proto","kind":"multi","n":5,"q":["下列哪些敘述符合開放標準的特性？（Which statements describe open standards?）"],"opts":[["A",["促進競爭"]],["B",["鼓勵創新"]],["C",["避免單一公司壟斷"]],["D",["不同廠商可以實作"]],["E",["提高產品互通性"]]],"ans":"ABCDE","note":"原檔標示 A、B、C、D，依內容 E 也正確，已校正。"},{"id":"proto.m6","unit":"proto","kind":"multi","n":6,"q":["下列哪些屬於 IEEE 802 系列的重要標準？（Which are important standards in the IEEE 802 series?）"],"opts":[["A",["IEEE 802.3"]],["B",["IEEE 802.11"]],["C",["Ethernet"]],["D",["WLAN"]],["E",["HTTP"]]],"ans":"ABCD"},{"id":"proto.m7","unit":"proto","kind":"multi","n":7,"q":["下列哪些是使用分層模型的優點？（Which are advantages of using layered models?）"],"opts":[["A",["協助協定設計"]],["B",["促進不同廠商產品競爭"]],["C",["降低不同層之間的相互影響"]],["D",["提供描述網路功能的通用語言"]],["E",["讓所有網路設備必須由同一家廠商製造"]]],"ans":"ABCD"},{"id":"proto.m8","unit":"proto","kind":"multi","n":8,"q":["下列哪些是 TCP/IP 模型與 OSI 模型的重要對應概念？（Which are important relationships between the TCP/IP and OSI models?）"],"opts":[["A",["OSI Layer 3 對應 Network/Internet Layer 的核心功能"]],["B",["OSI Layer 4 對應 Transport Layer"]],["C",["TCP 屬於傳輸層功能"]],["D",["UDP 屬於傳輸層功能"]],["E",["OSI Layer 4 主要負責實體媒體訊號傳輸"]]],"ans":"ABCD"},{"id":"proto.m9","unit":"proto","kind":"multi","n":9,"q":["下列哪些是 TCP/IP Web 通訊過程中不同協定的功能？（Which statements correctly describe protocol functions in TCP/IP Web communication?）"],"opts":[["A",["HTTP 負責 Client/Server 的請求與回應"]],["B",["TCP 負責傳輸資料段"]],["C",["IP 負責封包定址與傳送"]],["D",["Ethernet 可透過 LAN 實體媒體傳送 IP 封包"]],["E",["HTTP 負責實體媒體訊號傳輸"]]],"ans":"ABCD","note":"原檔未標示答案，依內容補上。"},{"id":"osi.s1","unit":"osi","kind":"single","n":1,"q":["下列何者屬於「協定模型」？","(Which is a protocol model?)"],"opts":[["A",["OSI 模型 (OSI model)"]],["B",["TCP/IP 模型 (TCP/IP model)"]],["C",["兩者皆是 (Both)"]],["D",["兩者皆非 (Neither)"]]],"ans":"B"},{"id":"osi.s2","unit":"osi","kind":"single","n":2,"q":["傳輸層的 PDU 稱為：","(The PDU at the transport layer is called:)"],"opts":[["A",["資料 (Data)"]],["B",["資料段 (Segment)"]],["C",["封包 (Packet)"]],["D",["訊框 (Frame)"]]],"ans":"B"},{"id":"osi.s3","unit":"osi","kind":"single","n":3,"q":["資料鏈結層的 PDU 稱為：","(The PDU at the data link layer is called:)"],"opts":[["A",["資料段 (Segment)"]],["B",["封包 (Packet)"]],["C",["訊框 (Frame)"]],["D",["位元 (Bit)"]]],"ans":"C"},{"id":"osi.s4","unit":"osi","kind":"single","n":4,"q":["將多個會談的片段在網路上交替發送、組合起來的程序稱為：","(The process of interleaving segments from multiple conversations on the network is called:)"],"opts":[["A",["封裝 (Encapsulation)"]],["B",["解封裝 (De-encapsulation)"]],["C",["多工傳輸 (Multiplexing)"]],["D",["路由 (Routing)"]]],"ans":"C"},{"id":"osi.s5","unit":"osi","kind":"single","n":5,"q":["乙太網路 MAC 位址的長度為：","(An Ethernet MAC address is how long?)"],"opts":[["A",["32 位元 (32 bits)"]],["B",["48 位元 (48 bits)"]],["C",["64 位元 (64 bits)"]],["D",["128 位元 (128 bits)"]]],"ans":"B"},{"id":"osi.s6","unit":"osi","kind":"single","n":6,"q":["OSI 模型的第 3 層是：","(Layer 3 of the OSI model is the:)"],"opts":[["A",["實體層 (Physical)"]],["B",["資料鏈結層 (Data link)"]],["C",["網路層 (Network)"]],["D",["傳輸層 (Transport)"]]],"ans":"C"},{"id":"osi.s7","unit":"osi","kind":"single","n":7,"q":["OSI 第 5、6、7 層合起來對應 TCP/IP 的哪一層？","(OSI layers 5, 6 and 7 together map to which TCP/IP layer?)"],"opts":[["A",["應用層 (Application)"]],["B",["傳輸層 (Transport)"]],["C",["網際網路層 (Internet)"]],["D",["網路存取層 (Network access)"]]],"ans":"A"},{"id":"osi.s8","unit":"osi","kind":"single","n":8,"q":["ARP 請求屬於哪一種訊息？","(An ARP request is which type of message?)"],"opts":[["A",["單播 (Unicast)"]],["B",["廣播 (Broadcast)"]],["C",["只送給路由器 (Sent only to routers)"]],["D",["只送給 DNS 伺服器 (Sent only to a DNS server)"]]],"ans":"B"},{"id":"osi.s9","unit":"osi","kind":"single","n":9,"q":["主機要傳送給遠端網路的主機時，訊框的目的 MAC 位址應是：","(When sending to a host on a remote network, the destination MAC address in the frame is that of the:)"],"opts":[["A",["最終目的主機 (Final destination host)"]],["B",["預設閘道 (Default gateway)"]],["C",["發送主機自己 (Sending host itself)"]],["D",["DNS 伺服器 (DNS server)"]]],"ans":"B"},{"id":"osi.s10","unit":"osi","kind":"single","n":10,"q":["OSI 模型最初由哪個組織設計？","(Which organization originally designed the OSI model?)"],"opts":[["A",["IEEE"]],["B",["IETF"]],["C",["ISO"]],["D",["Cisco"]]],"ans":"C"},{"id":"osi.m1","unit":"osi","kind":"multi","n":1,"q":["下列哪些是訊息分段的優點？","(Which are advantages of message segmentation?)"],"opts":[["A",["可交替發送多個會談的片段 (Segments from multiple conversations can be interleaved)"]],["B",["部分遺失時只需重傳遺失的片段 (Only lost segments need to be resent)"]],["C",["片段不必走同一條路徑 (Segments need not follow the same path)"]],["D",["減少每個片段所需的標頭資訊 (Less header information per segment)"]],["E",["鏈路故障時整個訊息仍必須全部重傳 (The entire message must still be resent on a link failure)"]]],"ans":"ABC"},{"id":"osi.m2","unit":"osi","kind":"multi","n":2,"q":["下列哪些是 TCP/IP 應用層的協定？","(Which are TCP/IP application layer protocols?)"],"opts":[["A",["HTTP"]],["B",["DNS"]],["C",["DHCP"]],["D",["FTP"]],["E",["TCP"]]],"ans":"ABCD"},{"id":"osi.m3","unit":"osi","kind":"multi","n":3,"q":["下列哪些是 OSI 傳輸層描述的功能？","(Which functions are described by the OSI transport layer?)"],"opts":[["A",["確認 (Acknowledgment)"]],["B",["錯誤復原 (Error recovery)"]],["C",["定序 (Sequencing)"]],["D",["以 IP 位址路由封包 (Routing packets by IP address)"]],["E",["以 MAC 位址定址 (Addressing by MAC address)"]]],"ans":"ABC"},{"id":"osi.m4","unit":"osi","kind":"multi","n":4,"q":["下列哪些位址位於 IP 封包標頭？","(Which addresses are in the IP packet header?)"],"opts":[["A",["來源 IP 位址 (Source IP address)"]],["B",["目的 IP 位址 (Destination IP address)"]],["C",["來源 MAC 位址 (Source MAC address)"]],["D",["目的 MAC 位址 (Destination MAC address)"]],["E",["錯誤檢查資訊 (Error-check information)"]]],"ans":"AB"},{"id":"osi.m5","unit":"osi","kind":"multi","n":5,"q":["下列哪些位於乙太網路訊框的標頭或標尾？","(Which are in the Ethernet frame header or trailer?)"],"opts":[["A",["來源 MAC 位址 (Source MAC address)"]],["B",["目的 MAC 位址 (Destination MAC address)"]],["C",["錯誤檢查資訊（標尾）(Error-check information, trailer)"]],["D",["來源 IP 位址 (Source IP address)"]],["E",["目的 IP 位址 (Destination IP address)"]]],"ans":"ABC"},{"id":"osi.m6","unit":"osi","kind":"multi","n":6,"q":["下列哪些關於 ARP 的敘述正確？","(Which statements about ARP are correct?)"],"opts":[["A",["ARP 請求以廣播發送 (The ARP request is broadcast)"]],["B",["ARP 請求包含目的裝置的 IP 位址 (The request contains the target IP address)"]],["C",["只有 IP 相符的裝置才回覆 (Only the device with the matching IP replies)"]],["D",["ARP 回覆包含對應的 MAC 位址 (The reply contains the associated MAC address)"]],["E",["ARP 回覆以廣播送給 LAN 所有裝置 (The reply is broadcast to all LAN devices)"]]],"ans":"ABCD"},{"id":"osi.m7","unit":"osi","kind":"multi","n":7,"q":["下列哪些關於預設閘道的敘述正確？","(Which statements about the default gateway are correct?)"],"opts":[["A",["是本地網路中路由器介面的 IP 位址 (It is the IP address of a router interface on the local network)"]],["B",["傳送到遠端網路時需要使用 (It is needed to reach remote networks)"]],["C",["本地網路每台主機都要設定 (Every host on the local network must be configured with it)"]],["D",["同一 LAN 內主機互相通訊時必須經過它 (Hosts on the same LAN must go through it to communicate)"]],["E",["主機可用 ARP 取得它的 MAC 位址 (A host can use ARP to learn its MAC address)"]]],"ans":"ABE"},{"id":"osi.m8","unit":"osi","kind":"multi","n":8,"q":["下列哪些是參考模型的特徵？","(Which are characteristics of a reference model?)"],"opts":[["A",["描述各層需完成什麼，但不規定如何完成 (Describes what each layer does, not how)"]],["B",["不是作為實作規範 (Not meant as an implementation specification)"]],["C",["幫助人們更清晰地了解涉及的功能和程序 (Helps understand the functions and processes involved)"]],["D",["與特定協定套件緊密結合 (Tightly bound to a specific protocol suite)"]],["E",["OSI 是最廣為人知的例子 (OSI is the best-known example)"]]],"ans":"ABCE"},{"id":"osi.m9","unit":"osi","kind":"multi","n":9,"q":["下列哪些 OSI 與 TCP/IP 的對應關係正確？","(Which OSI-to-TCP/IP mappings are correct?)"],"opts":[["A",["OSI 5～7 層 → 應用層 (OSI 5–7 → Application)"]],["B",["OSI 1～2 層 → 網路存取層 (OSI 1–2 → Network access)"]],["C",["OSI 第 4 層 → 傳輸層 (OSI 4 → Transport)"]],["D",["OSI 第 3 層 → 網際網路層 (OSI 3 → Internet)"]],["E",["OSI 第 2 層 → 網際網路層 (OSI 2 → Internet)"]]],"ans":"ABCD"},{"id":"osi.m10","unit":"osi","kind":"multi","n":10,"q":["下列哪些關於封裝過程的敘述正確？","(Which statements about encapsulation are correct?)"],"opts":[["A",["傳輸層加入傳輸標頭 (The transport layer adds a transport header)"]],["B",["網路層加入含 IP 位址的網路標頭 (The network layer adds a header containing IP addresses)"]],["C",["資料鏈結層加入訊框標頭與標尾 (The data link layer adds a frame header and trailer)"]],["D",["NIC 將位元編碼到媒體中 (The NIC encodes bits onto the media)"]],["E",["實體層加入訊框標尾 (The physical layer adds the frame trailer)"]]],"ans":"ABCD"},{"id":"phy1.s1","unit":"phy1","kind":"single","n":1,"q":["家庭中同時提供有線與無線連線的整合裝置常見的是：","(Which integrated device commonly provides both wired and wireless connectivity in homes?)"],"opts":[["A",["中繼器 (Repeater)"]],["B",["集線器 (Hub)"]],["C",["整合服務路由器 (ISR)"]],["D",["數據機 (Modem)"]]],"ans":"C"},{"id":"phy1.s2","unit":"phy1","kind":"single","n":2,"q":["下列何者不是網路媒體的基本形式？","(Which is NOT a basic form of network media?)"],"opts":[["A",["銅纜 (Copper)"]],["B",["光纜 (Fiber)"]],["C",["無線 (Wireless)"]],["D",["超音波 (Ultrasonic)"]]],"ans":"D"},{"id":"phy1.s3","unit":"phy1","kind":"single","n":3,"q":["在光纜中，位元以何種訊號表示？","(In fiber-optic cable, bits are represented by:)"],"opts":[["A",["電子脈衝 (Electrical pulses)"]],["B",["光模式 (Light patterns)"]],["C",["微波模式 (Microwave patterns)"]],["D",["聲波 (Sound waves)"]]],"ans":"B"},{"id":"phy1.s4","unit":"phy1","kind":"single","n":4,"q":["實體層從資料鏈結層接收的是：","(The physical layer receives which unit from the data link layer?)"],"opts":[["A",["封包 (Packet)"]],["B",["資料段 (Segment)"]],["C",["完整訊框 (Complete frame)"]],["D",["應用資料 (Application data)"]]],"ans":"C"},{"id":"phy1.s5","unit":"phy1","kind":"single","n":5,"q":["下列何者屬於線路編碼方法？","(Which is a line coding method?)"],"opts":[["A",["曼徹斯特編碼 (Manchester encoding)"]],["B",["脈衝編碼調變 (PCM)"]],["C",["調幅 (AM)"]],["D",["調頻 (FM)"]]],"ans":"A"},{"id":"phy1.s6","unit":"phy1","kind":"single","n":6,"q":["資料訊號與固定間隔的時脈訊號一起發送，稱為：","(Data signals sent together with a clock signal at fixed intervals is called:)"],"opts":[["A",["非同步 (Asynchronous)"]],["B",["同步 (Synchronous)"]],["C",["廣播 (Broadcast)"]],["D",["單播 (Unicast)"]]],"ans":"B"},{"id":"phy1.s7","unit":"phy1","kind":"single","n":7,"q":["在 PCM 中，取樣頻率至少必須是訊號最高頻率的幾倍？","(In PCM, the sampling rate must be at least how many times the signal's highest frequency?)"],"opts":[["A",["1 倍 (1×)"]],["B",["2 倍 (2×)"]],["C",["4 倍 (4×)"]],["D",["8 倍 (8×)"]]],"ans":"B"},{"id":"phy1.s8","unit":"phy1","kind":"single","n":8,"q":["載波的頻率隨訊號變化的調變技術是：","(Which modulation varies the carrier frequency with the signal?)"],"opts":[["A",["調幅 (AM)"]],["B",["調頻 (FM)"]],["C",["脈衝編碼調變 (PCM)"]],["D",["曼徹斯特 (Manchester)"]]],"ans":"B"},{"id":"phy1.s9","unit":"phy1","kind":"single","n":9,"q":["傳輸量減去建立會談、確認和封裝所產生的成本，稱為：","(Throughput minus the overhead of session setup, acknowledgments and encapsulation is:)"],"opts":[["A",["頻寬 (Bandwidth)"]],["B",["延遲時間 (Latency)"]],["C",["實際傳輸量 (Goodput)"]],["D",["位元時間 (Bit time)"]]],"ans":"C"},{"id":"phy1.s10","unit":"phy1","kind":"single","n":10,"q":["下列哪個組織是電機與電子工程師協會？","(Which organization is the Institute of Electrical and Electronics Engineers?)"],"opts":[["A",["ISO"]],["B",["ITU"]],["C",["ANSI"]],["D",["IEEE"]]],"ans":"D"},{"id":"phy1.m1","unit":"phy1","kind":"multi","n":1,"q":["下列哪些是無線連線的特性？","(Which are characteristics of wireless connections?)"],"opts":[["A",["效能隨距離增加而下降 (Performance drops with distance from the access point)"]],["B",["所有無線裝置共享對無線電波的存取 (All wireless devices share access to the radio waves)"]],["C",["同時存取的裝置越多，網路速度越差 (More simultaneous devices means a slower network)"]],["D",["每台裝置有獨立的專屬通訊通道 (Each device has its own dedicated channel)"]],["E",["可用範圍延伸器重新產生訊號 (A range extender can regenerate the signal)"]]],"ans":"ABCE"},{"id":"phy1.m2","unit":"phy1","kind":"multi","n":2,"q":["下列哪些是實體層標準管理的功能區？","(Which are functional areas governed by physical layer standards?)"],"opts":[["A",["實體元件 (Physical components)"]],["B",["編碼 (Encoding)"]],["C",["訊號 (Signaling)"]],["D",["路由 (Routing)"]],["E",["定序 (Sequencing)"]]],"ans":"ABC"},{"id":"phy1.m3","unit":"phy1","kind":"multi","n":3,"q":["下列哪些屬於實體元件？","(Which are physical components?)"],"opts":[["A",["網路介面卡 (NIC)"]],["B",["介面和連接器 (Interfaces and connectors)"]],["C",["纜線材料 (Cable materials)"]],["D",["纜線設計 (Cable design)"]],["E",["曼徹斯特編碼 (Manchester encoding)"]]],"ans":"ABCD"},{"id":"phy1.m4","unit":"phy1","kind":"multi","n":4,"q":["下列哪些是教材列出的常用調變技術？","(Which are modulation techniques listed in the material?)"],"opts":[["A",["調頻 (FM)"]],["B",["調幅 (AM)"]],["C",["脈衝編碼調變 (PCM)"]],["D",["非歸零 (NRZ)"]],["E",["曼徹斯特編碼 (Manchester)"]]],"ans":"ABC","note":"原檔標示 A、B；PCM（C）也屬於調變技術，已校正。"},{"id":"phy1.m5","unit":"phy1","kind":"multi","n":5,"q":["下列哪些是影響傳輸量的因素？","(Which factors affect throughput?)"],"opts":[["A",["流量大小 (Amount of traffic)"]],["B",["流量類型 (Type of traffic)"]],["C",["途中網路裝置數造成的延遲 (Latency from the number of network devices en route)"]],["D",["發送者的姓名 (Name of the sender)"]],["E",["路徑上最低的鏈路速度 (Slowest link speed on the path)"]]],"ans":"ABCE"},{"id":"phy1.m6","unit":"phy1","kind":"multi","n":6,"q":["下列哪些是非同步訊號傳輸的特徵？","(Which are characteristics of asynchronous signaling?)"],"opts":[["A",["資料訊號不與時脈訊號一同傳輸 (Data is not sent with a clock signal)"]],["B",["資料字元或資料塊之間的時間間隔任意 (Arbitrary spacing between characters or blocks)"]],["C",["訊框需要開始與停止指示旗標 (Frames need start and stop indicator flags)"]],["D",["以固定的位元時間發送 (Sent at a fixed bit time)"]],["E",["沒有標準化時間間隔 (No standardized time interval)"]]],"ans":"ABCE"},{"id":"phy1.m7","unit":"phy1","kind":"multi","n":7,"q":["下列哪些是銅媒體標準所定義的內容？","(Which are defined by copper media standards?)"],"opts":[["A",["銅纜類型 (Type of copper cable)"]],["B",["通訊頻寬 (Communication bandwidth)"]],["C",["連接器類型 (Connector type)"]],["D",["接腳和顏色標記 (Pinout and color coding)"]],["E",["媒體最大距離 (Maximum media distance)"]]],"ans":"ABCDE"},{"id":"phy1.m8","unit":"phy1","kind":"multi","n":8,"q":["下列哪些組織參與制定實體層標準？","(Which organizations are involved in physical layer standards?)"],"opts":[["A",["ISO"]],["B",["TIA/EIA"]],["C",["ITU"]],["D",["ANSI"]],["E",["IEEE"]]],"ans":"ABCDE"},{"id":"phy1.m9","unit":"phy1","kind":"multi","n":9,"q":["下列哪些關於有線連線的敘述正確？","(Which statements about wired connections are correct?)"],"opts":[["A",["效能不會因距離而降低 (Performance does not degrade like wireless)"]],["B",["移動非常受限 (Mobility is very limited)"]],["C",["每台有線裝置有自己的乙太網路纜線通道 (Each device has its own Ethernet cable channel)"]],["D",["有線裝置必須與其他裝置分享對網路的存取 (Wired devices must share network access with others)"]],["E",["通常必須固定位置 (Devices usually must stay in a fixed location)"]]],"ans":"BCE"},{"id":"phy1.m10","unit":"phy1","kind":"multi","n":10,"q":["下列哪些是實體層在傳輸資料時的步驟？","(Which are steps the physical layer takes when transmitting data?)"],"opts":[["A",["接收來自資料鏈結層的完整訊框 (Receive the complete frame from the data link layer)"]],["B",["將訊框編碼為訊號 (Encode the frame into signals)"]],["C",["以電子、光或無線電波訊號代表每個位元 (Represent each bit with electrical, optical or radio signals)"]],["D",["將訊號逐一發送到媒體上 (Send the signals onto the media one by one)"]],["E",["將位元分段並加上傳輸標頭 (Segment bits and add a transport header)"]]],"ans":"ABCD"},{"id":"phy2.s1","unit":"phy2","kind":"single","n":1,"q":["銅媒體受限於下列何者？","(Copper media is limited by:)"],"opts":[["A",["距離和訊號干擾 (Distance and signal interference)"]],["B",["全反射 (Total internal reflection)"]],["C",["光纖端末光潔度 (Fiber end finish)"]],["D",["雷射功率 (Laser power)"]]],"ans":"A"},{"id":"phy2.s2","unit":"phy2","kind":"single","n":2,"q":["交換器到路由器的連線通常使用：","(A switch-to-router connection typically uses:)"],"opts":[["A",["交叉纜線 (Crossover cable)"]],["B",["反轉線 (Rollover cable)"]],["C",["直通纜線 (Straight-through cable)"]],["D",["同軸纜線 (Coaxial cable)"]]],"ans":"C"},{"id":"phy2.s3","unit":"phy2","kind":"single","n":3,"q":["交換器到交換器的連線通常使用：","(A switch-to-switch connection typically uses:)"],"opts":[["A",["直通纜線 (Straight-through cable)"]],["B",["交叉纜線 (Crossover cable)"]],["C",["反轉線 (Rollover cable)"]],["D",["同軸纜線 (Coaxial cable)"]]],"ans":"B"},{"id":"phy2.s4","unit":"phy2","kind":"single","n":4,"q":["光脈衝被塗層反射而保留在核心內的現象稱為：","(The phenomenon in which light stays in the core by reflection at the cladding is called:)"],"opts":[["A",["串音 (Crosstalk)"]],["B",["衰減 (Attenuation)"]],["C",["全反射 (Total internal reflection)"]],["D",["調變 (Modulation)"]]],"ans":"C"},{"id":"phy2.s5","unit":"phy2","kind":"single","n":5,"q":["使用 LED 發送器、核心較大、普遍用於 LAN 的光纖是：","(Which fiber uses LED transmitters, has a larger core and is common in LANs?)"],"opts":[["A",["單模光纖 (SMF)"]],["B",["多模光纖 (MMF)"]],["C",["同軸纜線 (Coaxial)"]],["D",["STP 纜線 (STP)"]]],"ans":"B"},{"id":"phy2.s6","unit":"phy2","kind":"single","n":6,"q":["工作於 5 GHz、最高 54 Mb/s 的標準是：","(Which standard operates at 5 GHz with up to 54 Mb/s?)"],"opts":[["A",["802.11a"]],["B",["802.11b"]],["C",["802.11g"]],["D",["802.11ad"]]],"ans":"A"},{"id":"phy2.s7","unit":"phy2","kind":"single","n":7,"q":["IEEE 802.15 標準通常稱為：","(IEEE 802.15 is commonly called:)"],"opts":[["A",["Wi-Fi"]],["B",["WiMAX"]],["C",["藍芽 (Bluetooth)"]],["D",["WiGig"]]],"ans":"C"},{"id":"phy2.s8","unit":"phy2","kind":"single","n":8,"q":["資料鏈結層中負責與網路層通訊的子層是：","(Which data link sublayer communicates with the network layer?)"],"opts":[["A",["LLC（邏輯鏈結控制）"]],["B",["MAC（媒體存取控制）"]],["C",["實體層 (Physical layer)"]],["D",["傳輸層 (Transport layer)"]]],"ans":"A"},{"id":"phy2.s9","unit":"phy2","kind":"single","n":9,"q":["訊框標尾中 FCS 欄位內的 CRC 值用於：","(The CRC value in the FCS field of the frame trailer is used for:)"],"opts":[["A",["定址 (Addressing)"]],["B",["流量控制 (Flow control)"]],["C",["錯誤檢測 (Error detection)"]],["D",["標識第 3 層協定 (Identifying the Layer 3 protocol)"]]],"ans":"C"},{"id":"phy2.s10","unit":"phy2","kind":"single","n":10,"q":["下列何者使用 CSMA/CA 媒體存取方法？","(Which uses the CSMA/CA media access method?)"],"opts":[["A",["傳統乙太網路 (Legacy Ethernet)"]],["B",["802.11 無線網路 (802.11 wireless)"]],["C",["記號環 (Token Ring)"]],["D",["FDDI"]]],"ans":"B"},{"id":"phy2.m1","unit":"phy2","kind":"multi","n":1,"q":["下列哪些是銅媒體上 EMI/RFI 的潛在來源？","(Which are potential sources of EMI/RFI on copper media?)"],"opts":[["A",["螢光燈 (Fluorescent lights)"]],["B",["電動馬達 (Electric motors)"]],["C",["無線電波 (Radio waves)"]],["D",["光纖纜線 (Fiber-optic cable)"]],["E",["絞合線對 (Twisted pairs)"]]],"ans":"ABC"},{"id":"phy2.m2","unit":"phy2","kind":"multi","n":2,"q":["下列哪些是同軸纜線仍被使用的場合？","(In which situations is coaxial cable still used?)"],"opts":[["A",["天線連到無線裝置 (Antenna to wireless device)"]],["B",["有線電視到客戶駐地的最終連線 (Final cable-TV link to the customer)"]],["C",["混合光纖同軸網路 HFC (Hybrid Fiber Coax)"]],["D",["現代乙太網路主機到交換器 (Modern Ethernet host to switch)"]],["E",["路由器主控台連線 (Router console connection)"]]],"ans":"ABC"},{"id":"phy2.m3","unit":"phy2","kind":"multi","n":3,"q":["下列哪些是 TIA/EIA-568A 定義的元素？","(Which elements does TIA/EIA-568A define?)"],"opts":[["A",["纜線類型 (Cable types)"]],["B",["纜線長度 (Cable lengths)"]],["C",["連接器 (Connectors)"]],["D",["纜線端接與測試方法 (Termination and test methods)"]],["E",["無線載波頻率 (Wireless carrier frequency)"]]],"ans":"ABCD"},{"id":"phy2.m4","unit":"phy2","kind":"multi","n":4,"q":["下列哪些是安裝後以 UTP 測試器測試的參數？","(Which parameters are tested with a UTP cable tester after installation?)"],"opts":[["A",["線路圖 (Wire map)"]],["B",["纜線長度 (Cable length)"]],["C",["衰減造成的訊號損失 (Signal loss from attenuation)"]],["D",["串音 (Crosstalk)"]],["E",["光纖端末光潔度 (Fiber end finish)"]]],"ans":"ABCD"},{"id":"phy2.m5","unit":"phy2","kind":"multi","n":5,"q":["下列哪些是常見的光纖端接與拼接錯誤？","(Which are common fiber termination and splicing errors?)"],"opts":[["A",["位置不準 (Misalignment)"]],["B",["末端間隙 (End gap)"]],["C",["末端光潔度不足 (Poor end finish)"]],["D",["串音 (Crosstalk)"]],["E",["接地不良 (Poor grounding)"]]],"ans":"ABC"},{"id":"phy2.m6","unit":"phy2","kind":"multi","n":6,"q":["下列哪些是無線網路的關注重點？","(Which are concerns for wireless networks?)"],"opts":[["A",["覆蓋面積 (Coverage area)"]],["B",["干擾 (Interference)"]],["C",["安全性 (Security)"]],["D",["每公尺絞合數 (Twists per meter)"]],["E",["導體電阻 (Conductor resistance)"]]],"ans":"ABC"},{"id":"phy2.m7","unit":"phy2","kind":"multi","n":7,"q":["下列哪些是資料鏈結層訊框的通用欄位？","(Which are common data link frame fields?)"],"opts":[["A",["定址 (Addressing)"]],["B",["類型 (Type)"]],["C",["錯誤檢測 (Error detection)"]],["D",["來源 IP 位址 (Source IP address)"]],["E",["訊框開始與停止指示旗標 (Start and stop indicator flags)"]]],"ans":"ABCE"},{"id":"phy2.m8","unit":"phy2","kind":"multi","n":8,"q":["下列哪些是第 2 層（實體）位址的特性？","(Which are characteristics of Layer 2 (physical) addresses?)"],"opts":[["A",["非階層式 (Non-hierarchical)"]],["B",["不表示裝置位於哪個網路 (Do not indicate which network the device is on)"]],["C",["在本地網路之外沒有意義 (Meaningless outside the local network)"]],["D",["裝置移到另一子網仍使用同一位址 (Stay the same when the device moves to another subnet)"]],["E",["可用於確定 Internet 中裝置的位置 (Can locate a device on the Internet)"]]],"ans":"ABCD"},{"id":"phy2.m9","unit":"phy2","kind":"multi","n":9,"q":["下列哪些是競爭存取方法的特徵？","(Which are characteristics of contention-based access?)"],"opts":[["A",["非確定性 (Non-deterministic)"]],["B",["先以 CSMA 檢測媒體 (First senses the medium with CSMA)"]],["C",["可能發生碰撞並需重送 (Collisions may occur and require retransmission)"]],["D",["以記號決定傳輸順序 (A token determines transmission order)"]],["E",["媒體使用率高時延伸性不佳 (Scales poorly under heavy media use)"]]],"ans":"ABCE"},{"id":"phy2.m10","unit":"phy2","kind":"multi","n":10,"q":["下列哪些是常見的資料鏈結層協定？","(Which are common data link layer protocols?)"],"opts":[["A",["PPP"]],["B",["HDLC"]],["C",["訊框中繼 (Frame Relay)"]],["D",["802.11 無線網路 (802.11 wireless)"]],["E",["TCP"]]],"ans":"ABCD"}],"terms":{"net1":[["網際網路","Internet"],["網路","Network"],["網路基礎建設","Network Infrastructure"],["終端裝置","End Device"],["主機","Host"],["用戶端","Client"],["伺服器","Server"],["中介網路裝置","Intermediary Device"],["網路媒體","Network Media"],["網路服務","Network Services"],["區域網路","LAN（Local Area Network）"],["廣域網路","WAN（Wide Area Network）"],["都會網路","MAN（Metropolitan Area Network）"],["無線區域網路","WLAN（Wireless Local Area Network）"],["儲存區域網路","SAN（Storage Area Network）"],["拓樸圖","Topology Diagram"],["實體拓樸","Physical Topology"],["邏輯拓樸","Logical Topology"],["統合網路","Converged Network"],["服務供應商／網際網路服務供應商","Service Provider / ISP（Internet Service Provider）"]],"net2":[["容錯能力","Fault Tolerance"],["可延伸性","Scalability"],["服務品質","Quality of Service(QoS)"],["備援","Redundancy"],["電路交換","Circuit Switching"],["分封交換","Packet Switching"],["封包","Packet"],["頻寬","Bandwidth"],["壅塞","Congestion"],["佇列","Queue"],["骨幹","Backbone"],["對等連線","Peering"],["機密性","Confidentiality"],["完整性","Integrity"],["可用性","Availability"],["零時差攻擊","Zero-day Attack"],["服務阻斷","Denial of Service (DoS)"],["自攜裝置","Bring Your Own Device (BYOD)"],["雲端運算","Cloud Computing"],["虛擬化","Virtualization"]],"osi":[["協定模型","Protocol Model"],["參考模型","Reference Model"],["應用層","Application Layer"],["表現層","Presentation Layer"],["會談層","Session Layer"],["傳輸層","Transport Layer"],["網際網路層","Internet Layer"],["網路存取層","Network Access Layer"],["資料鏈結層","Data Link Layer"],["實體層","Physical Layer"],["分段","Segmentation"],["多工傳輸","Multiplexing"],["協定資料單元","Protocol Data Unit (PDU)"],["封裝","Encapsulation"],["解封裝","De-encapsulation"],["訊框","Frame"],["標頭","Header"],["實體位址（固化位址）","Physical Address"],["位址解析協定","Address Resolution Protocol (ARP)"],["預設閘道","Default Gateway"]],"phy1":[["網路介面卡","Network Interface Card (NIC)"],["無線存取點","Wireless Access Point (AP)"],["整合服務路由器","Integrated Services Router (ISR)"],["無線範圍延伸器","Wireless Range Extender"],["銅纜","Copper Cable"],["光纜","Fiber-Optic Cable"],["編碼（線路編碼）","Encoding (Line Coding)"],["曼徹斯特編碼","Manchester Encoding"],["非歸零","Non-Return to Zero (NRZ)"],["訊號方法","Signaling Method"],["非同步","Asynchronous"],["同步","Synchronous"],["位元時間","Bit Time"],["調變","Modulation"],["載波","Carrier Wave"],["脈衝編碼調變","Pulse Code Modulation (PCM)"],["頻寬","Bandwidth"],["傳輸量","Throughput"],["延遲時間","Latency"],["實際傳輸量","Goodput"]],"phy2":[["電磁干擾","Electromagnetic Interference (EMI)"],["射頻干擾","Radio Frequency Interference (RFI)"],["串音","Crosstalk"],["非遮蔽雙絞線","Unshielded Twisted-Pair (UTP)"],["遮蔽雙絞線","Shielded Twisted-Pair (STP)"],["同軸纜線","Coaxial Cable"],["直通纜線","Straight-Through Cable"],["交叉纜線","Crossover Cable"],["反轉線","Rollover Cable"],["單模光纖","Single-Mode Fiber (SMF)"],["多模光纖","Multimode Fiber (MMF)"],["全反射","Total Internal Reflection"],["光時域反射器","Optical Time Domain Reflectometer (OTDR)"],["光纖到戶","Fiber To The Home (FTTH)"],["邏輯鏈結控制","Logical Link Control (LLC)"],["媒體存取控制","Media Access Control (MAC)"],["訊框檢查序列","Frame Check Sequence (FCS)"],["循環冗餘檢查","Cyclic Redundancy Check (CRC)"],["半雙工","Half-Duplex"],["全雙工","Full-Duplex"]],"proto":[["網路協定","Network Protocol"],["協定套件","Protocol Suite"],["協定堆疊","Protocol Stack"],["訊息編碼","Message Encoding"],["訊息解碼","Message Decoding"],["封裝","Encapsulation"],["解封裝","De-encapsulation"],["分段","Segmentation"],["流量控制","Flow Control"],["單點傳送","Unicast"],["多點傳送","Multicast"],["廣播","Broadcast"],["開放標準","Open Standard"],["專有協定","Proprietary Protocol"],["網際網路工程任務組","Internet Engineering Task Force (IETF)"],["電機與電子工程師協會","Institute of Electrical and Electronics Engineers (IEEE)"],["國際標準化組織","International Organization for Standardization (ISO)"],["徵求修正意見書","Request for Comments (RFC)"],["開放式系統互聯參考模型","Open Systems Interconnection Reference Model (OSI Model)"],["TCP/IP 協定套件","TCP/IP Protocol Suite"]]}};

<script>
(function(){
'use strict';
var KEY='netquiz.v1';
var store={last:{},prefs:{shuffle:true,count:'all'}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.last)store.last=p.last;if(p&&p.prefs)store.prefs=Object.assign(store.prefs,p.prefs)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

var UNIT={};DATA.units.forEach(function(u){UNIT[u.id]=u});
var KIND_NAME={single:'單選',multi:'複選',term:'專有名詞'};

/* ---------- base items ---------- */
var BASE=[];
DATA.units.forEach(function(u){
  DATA.questions.filter(function(q){return q.unit===u.id}).forEach(function(q){BASE.push(q)});
  (DATA.terms[u.id]||[]).forEach(function(t,i){
    BASE.push({id:u.id+'.t'+(i+1),unit:u.id,kind:'term',n:i+1,zh:t[0],en:t[1]});
  });
});
var BY_ID={};BASE.forEach(function(b){BY_ID[b.id]=b});

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function $(sel,root){return (root||document).querySelector(sel)}
function sameSet(a,b){if(a.size!==b.size)return false;var ok=true;a.forEach(function(x){if(!b.has(x))ok=false});return ok}
function listLetters(set){return Array.from(set).sort().join('、')}
function count(filter){return BASE.filter(filter).length}
function mastered(filter){return BASE.filter(function(b){return filter(b)&&store.last[b.id]===1}).length}
function wrongIds(){return BASE.filter(function(b){return store.last[b.id]===0}).map(function(b){return b.id})}

/* build a playable item from a base item */
function build(b){
  if(b.kind!=='term'){
    return {id:b.id,kind:b.kind,unit:b.unit,n:b.n,q:b.q,opts:b.opts.map(function(o){return {k:o[0],lines:o[1]}}),ans:new Set(b.ans.split('')),note:b.note};
  }
  var pool=(DATA.terms[b.unit]||[]).map(function(t){return t[1]}).filter(function(e){return e!==b.en});
  var opts=shuffle(shuffle(pool).slice(0,3).concat([b.en]));
  var letters=['A','B','C','D'];var ans;
  var o=opts.map(function(e,i){if(e===b.en)ans=letters[i];return {k:letters[i],lines:[e]}});
  return {id:b.id,kind:'term',unit:b.unit,n:b.n,zh:b.zh,opts:o,ans:new Set([ans])};
}

/* ---------- state ---------- */
var S={view:'home',title:'',items:[],i:0,sel:new Set(),revealed:false,results:[]};
var app=$('#app');

function start(title,ids){
  var list=ids.map(function(id){return BY_ID[id]}).filter(Boolean);
  if(store.prefs.shuffle)list=shuffle(list);
  if(store.prefs.count!=='all')list=list.slice(0,parseInt(store.prefs.count,10));
  if(!list.length)return;
  S={view:'quiz',title:title,items:list.map(build),i:0,sel:new Set(),revealed:false,results:[]};
  render();window.scrollTo(0,0);
}

/* ---------- views ---------- */
function renderHome(){
  var totalQ=count(function(b){return b.kind!=='term'}),totalT=count(function(b){return b.kind==='term'});
  var done=BASE.filter(function(b){return b.id in store.last}).length;
  var good=BASE.filter(function(b){return store.last[b.id]===1}).length;
  var wr=wrongIds().length;
  var h='';
  h+='<header><p class="prompt"><b>Switch&gt;</b> enable</p><h1 class="title">網路概論刷題站</h1>'+
     '<p class="lede">共 '+totalQ+' 題選擇題與 '+totalT+' 題專有名詞測驗。題目與選項沿用原文，單選、複選都有，答完立即顯示正確答案。</p></header>';
  h+='<div class="summary num"><span>已練習 <b>'+done+'</b> / '+BASE.length+' 題</span><span>最近一次答對 <b>'+good+'</b> 題</span><span>錯題本 <b>'+wr+'</b> 題</span></div>';

  h+='<section class="grp"><h2 class="sec">快速開始</h2><div class="quick">';
  h+=qbtn('all','全部題目','全部章節混合',BASE.length,true);
  h+=qbtn('single','全部單選','',count(function(b){return b.kind==='single'}));
  h+=qbtn('multi','全部複選','',count(function(b){return b.kind==='multi'}));
  h+=qbtn('term','全部專有名詞','中文選英文',count(function(b){return b.kind==='term'}));
  h+=qbtn('wrong','錯題本','答錯的題目',wr);
  h+='</div></section>';

  h+='<section class="settings"><label><input type="checkbox" id="optShuffle"'+(store.prefs.shuffle?' checked':'')+'> 題目順序隨機</label>'+
     '<label>每回題數 <select id="optCount">'+['all','10','20','30','50'].map(function(v){return '<option value="'+v+'"'+(store.prefs.count===v?' selected':'')+'>'+(v==='all'?'全部':v+' 題')+'</option>'}).join('')+'</select></label></section>';

  h+='<section class="grp"><h2 class="sec">依章節練習</h2><div class="units">';
  DATA.units.forEach(function(u){
    h+='<div class="unit"><div><div class="nm">'+esc(u.name)+'</div><div class="sb">'+esc(u.sub)+'</div></div><div class="chips">';
    ['single','multi','term'].forEach(function(k){
      var f=function(b){return b.unit===u.id&&b.kind===k};
      var n=count(f);if(!n)return;
      var m=mastered(f);
      h+='<button class="chip" data-start="unit" data-unit="'+u.id+'" data-kind="'+k+'">'+KIND_NAME[k]+' <span class="num">'+n+'</span><span class="m num'+(m===n?' full':'')+'">'+(m?m+'/'+n+' 已答對':'')+'</span></button>';
    });
    h+='</div></div>';
  });
  h+='</div></section>';
  h+='<div class="foot"><span>練習紀錄只存在這台裝置的瀏覽器。</span><button class="linkbtn" id="reset">清除練習紀錄</button></div>';
  app.innerHTML=h;
}
function qbtn(mode,t,s,n,primary){
  var dis=!n?' disabled':'';
  return '<button class="qbtn'+(primary?' primary':'')+'" data-start="'+mode+'"'+dis+'><span class="t">'+t+' <span class="num">'+n+'</span> 題</span>'+(s?'<span class="s">'+s+'</span>':'')+'</button>';
}

function optHtml(it,o,state){
  var cls='opt',st='';
  var chosen=S.sel.has(o.k),isAns=it.ans.has(o.k);
  if(state==='reveal'){
    if(isAns){cls+=' right';st=chosen?'✓ 正確':'漏選'}
    else if(chosen){cls+=' wrong';st='✕ 錯誤'}
  }else if(chosen)cls+=' sel';
  var tx=fmt(o.lines[0])+(o.lines[1]?'<span class="en">'+fmt(o.lines[1])+'</span>':'');
  return '<li><button class="'+cls+'" data-k="'+o.k+'" aria-pressed="'+(chosen?'true':'false')+'"'+(state==='reveal'?' disabled':'')+'><span class="k">'+o.k+'</span><span class="tx">'+tx+'</span>'+(st?'<span class="st">'+st+'</span>':'')+'</button></li>';
}
function qHtml(it){
  if(it.kind==='term')return '<div class="q">「<span class="big">'+esc(it.zh)+'</span>」的英文是？</div>';
  var h='<div class="q">'+fmt(it.q[0]);
  for(var i=1;i<it.q.length;i++)h+='<span class="en">'+fmt(it.q[i])+'</span>';
  return h+'</div>';
}
function renderQuiz(){
  var it=S.items[S.i],total=S.items.length;
  var multi=it.kind==='multi';
  var h='<div class="top"><button class="back" id="leave">← 離開</button><div class="ttl">'+esc(S.title)+'</div><div class="cnt num">'+(S.i+1)+' / '+total+'</div></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+S.i+'"><i style="width:'+(S.i/total*100)+'%"></i></div>';
  h+='<article class="card"><div class="meta"><span class="tag'+(multi?' multi':'')+'">'+KIND_NAME[it.kind]+'</span><span>'+esc(UNIT[it.unit].name)+'・第 '+it.n+' 題</span></div>'+qHtml(it);
  if(multi)h+='<p class="hint">複選題：選出所有正確答案，再按「確認答案」。</p>';
  h+='<ul class="opts">'+it.opts.map(function(o){return optHtml(it,o,S.revealed?'reveal':'')}).join('')+'</ul>';
  if(S.revealed){
    var ok=sameSet(S.sel,it.ans);
    h+='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'答對了':'答錯了')+'</b>'+
       '<span class="ans">正確答案：'+listLetters(it.ans)+(ok?'':'　你選的：'+(S.sel.size?listLetters(S.sel):'未作答'))+'</span>'+
       (it.note?'<span class="note">'+esc(it.note)+'</span>':'')+'</div>';
  }
  h+='</article>';
  h+='<div class="actions">';
  if(!S.revealed)h+='<button class="btn" id="confirm"'+(S.sel.size?'':' disabled')+'>確認答案</button>';
  else h+='<button class="btn" id="next">'+(S.i+1<total?'下一題':'看結果')+'</button>';
  h+='</div>';
  app.innerHTML=h;
}
function renderResult(){
  var total=S.results.length,ok=S.results.filter(function(r){return r.ok}).length;
  var pct=total?Math.round(ok/total*100):0;
  var bad=S.results.filter(function(r){return !r.ok});
  var h='<div class="top"><button class="back" id="home">← 回首頁</button><div class="ttl">'+esc(S.title)+'</div></div>';
  h+='<div class="card"><div class="score"><span class="big">'+ok+'</span><span class="of num">/ '+total+' 題答對</span><span class="pct '+(pct>=80?'good':pct>=60?'mid':'low')+'">'+pct+'%</span></div>';
  h+=bad.length?'<p class="hint">答錯的 '+bad.length+' 題已加入錯題本，之後答對就會移出。</p>':'<p class="hint">這一回全部答對。</p>';
  h+='</div>';
  if(bad.length){
    h+='<section class="grp"><h2 class="sec">答錯的題目</h2><div class="wlist">';
    bad.forEach(function(r){
      var it=r.item;
      var qtxt=it.kind==='term'?'「'+esc(it.zh)+'」的英文是？':fmt(it.q[0]);
      h+='<details class="w"><summary><span class="qs">'+qtxt+'</span><span class="tg">'+KIND_NAME[it.kind]+'</span></summary><div class="body">';
      if(it.kind!=='term'&&it.q[1])h+='<div class="hint">'+fmt(it.q[1])+'</div>';
      h+='<ul class="opts">'+it.opts.map(function(o){
        var chosen=r.picked.has(o.k),isAns=it.ans.has(o.k),cls='opt',st='';
        if(isAns){cls+=' right';st=chosen?'✓ 正確':'漏選'}else if(chosen){cls+=' wrong';st='✕ 你選的'}
        var tx=fmt(o.lines[0])+(o.lines[1]?'<span class="en">'+fmt(o.lines[1])+'</span>':'');
        return '<li><div class="'+cls+'"><span class="k">'+o.k+'</span><span class="tx">'+tx+'</span>'+(st?'<span class="st">'+st+'</span>':'')+'</div></li>';
      }).join('')+'</ul>';
      if(it.note)h+='<p class="hint">'+esc(it.note)+'</p>';
      h+='</div></details>';
    });
    h+='</div></section>';
  }
  h+='<div class="actions">';
  if(bad.length)h+='<button class="btn" id="retryWrong">重做這 '+bad.length+' 題</button>';
  h+='<button class="btn ghost" id="again">再來一回</button></div>';
  app.innerHTML=h;
}
function render(){
  if(S.view==='home')renderHome();else if(S.view==='quiz')renderQuiz();else renderResult();
}

/* ---------- actions ---------- */
function idsFor(mode,unit,kind){
  if(mode==='all')return BASE.map(function(b){return b.id});
  if(mode==='wrong')return wrongIds();
  if(mode==='unit')return BASE.filter(function(b){return b.unit===unit&&b.kind===kind}).map(function(b){return b.id});
  return BASE.filter(function(b){return b.kind===mode}).map(function(b){return b.id});
}
var lastRun={title:'',ids:[]};
function launch(title,ids){lastRun={title:title,ids:ids};start(title,ids)}
function confirmAnswer(){
  var it=S.items[S.i];if(S.revealed||!S.sel.size)return;
  var ok=sameSet(S.sel,it.ans);
  S.results.push({item:it,picked:new Set(S.sel),ok:ok});
  store.last[it.id]=ok?1:0;save();
  S.revealed=true;renderQuiz();
  var fb=$('.fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function nextQ(){
  if(S.i+1<S.items.length){S.i++;S.sel=new Set();S.revealed=false;renderQuiz();window.scrollTo(0,0)}
  else{S.view='result';render();window.scrollTo(0,0)}
}
function pick(k){
  var it=S.items[S.i];if(S.revealed)return;
  if(!it.opts.some(function(o){return o.k===k}))return;
  if(it.kind==='multi'){if(S.sel.has(k))S.sel.delete(k);else S.sel.add(k);renderQuiz()}
  else{S.sel=new Set([k]);confirmAnswer()}
}

app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){
    var m=t.dataset.start,nm;
    if(m==='unit')nm=UNIT[t.dataset.unit].name+'・'+KIND_NAME[t.dataset.kind];
    else nm={all:'全部題目',single:'全部單選',multi:'全部複選',term:'全部專有名詞',wrong:'錯題本'}[m];
    launch(nm,idsFor(m,t.dataset.unit,t.dataset.kind));return;
  }
  if(t.dataset.k){pick(t.dataset.k);return}
  switch(t.id){
    case 'confirm':confirmAnswer();break;
    case 'next':nextQ();break;
    case 'leave':case 'home':S.view='home';render();window.scrollTo(0,0);break;
    case 'again':launch(lastRun.title,lastRun.ids);break;
    case 'retryWrong':
      launch(S.title+'・重做錯題',S.results.filter(function(r){return !r.ok}).map(function(r){return r.item.id}));break;
    case 'reset':
      if(t.dataset.sure){store.last={};save();render()}
      else{t.dataset.sure='1';t.textContent='再按一次確認清除'}
      break;
  }
});
app.addEventListener('change',function(e){
  if(e.target.id==='optShuffle'){store.prefs.shuffle=e.target.checked;save()}
  if(e.target.id==='optCount'){store.prefs.count=e.target.value;save()}
});
document.addEventListener('keydown',function(e){
  if(S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toUpperCase();
  if(/^[A-E]$/.test(k)){pick(k);return}
  if(e.key==='Enter'){
    var tg=e.target&&e.target.tagName;
    if(tg==='BUTTON'&&e.target.id!=='confirm'&&e.target.id!=='next')return;
    e.preventDefault();
    if(S.revealed)nextQ();else confirmAnswer();
  }
});
render();
})();
</script>

</body></html>
